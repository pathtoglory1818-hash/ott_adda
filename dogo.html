<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTT ADDA | Future Commerce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --bg-panel: rgba(20, 20, 30, 0.7);
            --neon-cyan: #00f3ff;
            --neon-pink: #bd00ff;
            --neon-green: #00ff9d;
            --text-main: #ffffff;
            --text-dim: #8892b0;
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(189, 0, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.1) 0%, transparent 20%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- HEADER --- */
        header {
            position: fixed;
            top: 0; width: 100%;
            padding: 1.5rem 5%;
            display: flex; justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            border-bottom: var(--glass-border);
            z-index: 1000;
            background: rgba(5, 5, 5, 0.8);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem; font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-cyan);
            cursor: pointer;
        }

        /* --- LAYOUT UTILS --- */
        .container { padding: 7rem 5% 5rem; min-height: 100vh; }
        .hidden { display: none !important; }
        
        /* --- HERO --- */
        .hero { text-align: center; margin-bottom: 4rem; }
        .hero h1 {
            font-family: 'Orbitron', sans-serif; font-size: 4rem;
            background: linear-gradient(90deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        .hero p { color: var(--text-dim); font-size: 1.2rem; max-width: 600px; margin: 0 auto; }

        /* --- GRID VIEW --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--bg-panel);
            border: var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            transition: 0.4s ease;
            cursor: pointer;
            overflow: hidden;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--neon-cyan); }
        
        .card-img {
            height: 220px; 
            background: rgba(0,0,0,0.3);
            margin-bottom: 1.5rem; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        .product-png {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 8px var(--glow-color)); 
        }

        .card:hover .product-png {
            transform: scale(1.1);
            filter: drop-shadow(0 0 15px var(--glow-color));
        }

        .card h3 { font-family: 'Orbitron', sans-serif; margin-bottom: 0.5rem; }
        .card p { color: var(--text-dim); margin-bottom: 1rem; }
        .price { font-size: 1.5rem; font-weight: 700; color: var(--neon-cyan); }

        /* --- DETAIL VIEW --- */
        .detail-view {
            display: flex; flex-wrap: wrap; gap: 4rem;
            animation: fadeIn 0.5s ease;
        }

        .detail-image {
            flex: 1; min-width: 300px; height: 500px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--neon-cyan);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
        }
        
        .detail-png {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 0 20px var(--glow-color));
        }

        .detail-content { flex: 1; min-width: 300px; }
        
        .back-btn {
            background: transparent; border: none; color: var(--text-dim);
            cursor: pointer; margin-bottom: 1rem; font-size: 1.1rem;
            display: flex; align-items: center; gap: 5px;
        }
        .back-btn:hover { color: var(--neon-cyan); }

        .detail-title { font-family: 'Orbitron', sans-serif; font-size: 3rem; margin-bottom: 0.5rem; text-transform: uppercase; }
        .detail-price { font-size: 2.5rem; color: var(--neon-cyan); font-weight: 700; margin-bottom: 2rem; display: block; }
        .detail-desc { font-size: 1.2rem; line-height: 1.6; color: var(--text-dim); margin-bottom: 3rem; border-left: 3px solid var(--neon-pink); padding-left: 1rem; }

        .add-btn {
            width: 100%; padding: 1.2rem; background: var(--neon-cyan); border: none;
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.2rem;
            color: #000; cursor: pointer;
            clip-path: polygon(5% 0, 100% 0, 100% 70%, 95% 100%, 0 100%, 0 30%);
            transition: 0.3s;
        }
        .add-btn:hover { background: #fff; box-shadow: 0 0 20px #fff; }

        /* --- TOAST --- */
        #toast {
            visibility: hidden; min-width: 250px; background-color: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--neon-cyan); color: #fff; text-align: center;
            border-radius: 4px; padding: 16px; position: fixed; z-index: 1001;
            left: 50%; bottom: 30px; transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif; box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }

        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>

        const grid = document.getElementById('product-grid');

        // Render Grid
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.setProperty('--glow-color', p.color);
            card.onclick = () => showDetail(p.id);
            card.innerHTML = `
                <div class="card-img">

        // --- NAVIGATION ---
        function showDetail(id) {
            const product = products.find(p => p.id === id);
            
            document.getElementById('detail-title').innerText = product.name;
            document.getElementById('detail-price').innerText = product.price;
            document.getElementById('detail-price').style.color = product.color;
            document.getElementById('detail-desc').innerText = product.desc;
            
            const imgContainer = document.getElementById('detail-image-container');

            imgContainer.style.setProperty('--glow-color', product.color);

            homeView.classList.add('hidden');
            detailView.classList.remove('hidden');
            window.scrollTo(0,0);
        }

        // --- TELEGRAM BUY FUNCTION ---

            }, 1000);
